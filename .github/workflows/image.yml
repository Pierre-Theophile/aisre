# SPDX-License-Identifier: Apache-2.0
#
# Publishes the aisre container image to the GitHub Container Registry, with the repository's
# own GITHUB_TOKEN: no registry account and no secret to manage.
#
#   ghcr.io/pierre-theophile/aisre:main        the latest commit on main
#   ghcr.io/pierre-theophile/aisre:sha-<sha>   one commit, for pinning a deployment
#   ghcr.io/pierre-theophile/aisre:1.2.3       a release tag v1.2.3, plus :1.2 and :latest
#
# linux/amd64 and linux/arm64. The Dockerfile cross-compiles, so arm64 needs no emulation.
#
# Cloud Run pulls from Artifact Registry or Docker Hub only: point an Artifact Registry remote
# repository at https://ghcr.io and deploy from it (deploy/README.md).

name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["specs/**", "docs/**", "fixtures/**"]
  pull_request:
    branches: [main]
    paths: ["Dockerfile", ".dockerignore", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # A pull request builds the image to prove the Dockerfile still works, and publishes nothing.
      - name: log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry paths must be lower case; the repository owner is not.
      - name: image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=aisre
            org.opencontainers.image.licenses=Apache-2.0

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
