# SPDX-License-Identifier: Apache-2.0
#
# The identity `deploy/kind/rbac/kubeconfig.sh` mints a token for.
#
# Deliberately not `automountServiceAccountToken: true` on a pod: the feeder runs on the host
# in this demo, so the token is requested explicitly, is short-lived, and is not left lying in
# any container's filesystem.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent-feeder
  namespace: sre-agent
  labels:
    app.kubernetes.io/part-of: sre-agent
