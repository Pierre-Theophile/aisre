# SPDX-License-Identifier: Apache-2.0
#
# checkout: the service every query in the fixtures focuses on.
#
# It is the only workload that takes checkout-config through envFrom, which is what
# deploy/kind/scenarios/config-change.sh perturbs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: shop
  labels:
    app.kubernetes.io/name: checkout
    app.kubernetes.io/part-of: shop
    team: team-checkout
  annotations:
    resource.opentelemetry.io/service.name: checkout
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout
        app.kubernetes.io/part-of: shop
        team: team-checkout
      annotations:
        resource.opentelemetry.io/service.name: checkout
    spec:
      containers:
        - name: app
          image: nginx:1.31.5-alpine-slim
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: checkout-config
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: shop
  labels:
    app.kubernetes.io/name: checkout
    app.kubernetes.io/part-of: shop
spec:
  selector:
    app.kubernetes.io/name: checkout
  ports:
    - name: http
      port: 80
      targetPort: http
