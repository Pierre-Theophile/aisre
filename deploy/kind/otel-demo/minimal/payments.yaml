#
# payments: the workload the rollout scenario rolls.
#
# deploy/kind/scenarios/rollout.sh flips the `app` container image between two pinned nginx
# patch releases and bumps the service.version the emitters report, so both feeders see a
# rollout: the Kubernetes feeder from the revision change, the OTLP feeder from the
# service.version transition (FR-042, FR-043).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: shop
  labels:
    app.kubernetes.io/name: payments
    app.kubernetes.io/part-of: shop
    team: team-payments
  annotations:
    resource.opentelemetry.io/service.name: payments
    kubernetes.io/change-cause: "initial deploy"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: payments
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments
        app.kubernetes.io/part-of: shop
        team: team-payments
      annotations:
        resource.opentelemetry.io/service.name: payments
    spec:
      containers:
        - name: app
          image: nginx:1.31.5-alpine-slim
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            # Mounted, not envFrom: the fixture records `sre.k8s.reference: volume` on the
            # payments → payments-secret depends-on edge.
            - name: payments-secret
              mountPath: /etc/payments
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: payments-secret
          secret:
            secretName: payments-secret
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: shop
  labels:
    app.kubernetes.io/name: payments
    app.kubernetes.io/part-of: shop
spec:
  selector:
    app.kubernetes.io/name: payments
  ports:
    - name: http
      port: 80
      targetPort: http
