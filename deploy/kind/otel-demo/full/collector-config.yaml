# SPDX-License-Identifier: Apache-2.0
#
# Patch: send the demo's traces to sre-agent as well as to Jaeger.
#
# The collector's whole configuration lives in one ConfigMap key, `relay`, as a YAML string.
# There is no way to edit part of a string with kustomize, so this patch replaces the key. Its
# content is byte-for-byte the upstream configuration of opentelemetry-demo 2.2.0 plus exactly
# two additions, both marked below:
#
#   exporters.otlp/sre-agent                       a second OTLP/gRPC exporter, endpoint taken
#                                                  from the environment
#   service.pipelines.traces.exporters             otlp/sre-agent appended
#
# Regenerating this after bumping OTEL_DEMO_VERSION in fetch-upstream.sh:
#
#   python3 - <<'PY'
#   import yaml
#   docs = [d for d in yaml.safe_load_all(open('upstream/opentelemetry-demo.yaml')) if d]
#   cm = next(d for d in docs
#             if d['kind'] == 'ConfigMap' and d['metadata']['name'] == 'otel-collector')
#   cfg = yaml.safe_load(cm['data']['relay'])
#   cfg['exporters']['otlp/sre-agent'] = {
#       'endpoint': '${env:OTLP_GRPC_ENDPOINT}', 'tls': {'insecure': True}}
#   cfg['service']['pipelines']['traces']['exporters'].append('otlp/sre-agent')
#   print(yaml.safe_dump(cfg, sort_keys=True, width=98))
#   PY
#
# then re-indent the output by four spaces under `relay: |`.
#
# ${env:OTLP_GRPC_ENDPOINT} is the collector's own environment-variable syntax; the value comes
# from the sre-agent-otlp ConfigMap through the envFrom added in collector-deployment.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: otel-demo
data:
  relay: |
    connectors:
      spanmetrics: {}
    exporters:
      debug: {}
      opensearch:
        http:
          endpoint: http://opensearch:9200
          tls:
            insecure: true
        logs_index: otel-logs
        logs_index_time_format: yyyy-MM-dd
      otlp:
        endpoint: jaeger-collector:4317
        tls:
          insecure: true
    # >>> sre-agent addition
      otlp/sre-agent:
        endpoint: ${env:OTLP_GRPC_ENDPOINT}
        tls:
          insecure: true
      otlphttp/prometheus:
        endpoint: http://prometheus:9090/api/v1/otlp
        tls:
          insecure: true
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    processors:
      batch: {}
      k8sattributes:
        extract:
          metadata:
          - k8s.namespace.name
          - k8s.deployment.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.cronjob.name
          - k8s.job.name
          - k8s.node.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.pod.start_time
        passthrough: false
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: connection
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource:
        attributes:
        - action: insert
          from_attribute: k8s.pod.uid
          key: service.instance.id
      resourcedetection:
        detectors:
        - env
        - system
      transform:
        error_mode: ignore
        trace_statements:
        - context: span
          statements:
          - replace_pattern(name, "\\?.*", "")
          - replace_match(name, "GET /api/products/*", "GET /api/products/{productId}")
    receivers:
      httpcheck/frontend-proxy:
        targets:
        - endpoint: http://frontend-proxy:8080
      jaeger:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:14250
          thrift_compact:
            endpoint: ${env:MY_POD_IP}:6831
          thrift_http:
            endpoint: ${env:MY_POD_IP}:14268
      nginx:
        collection_interval: 10s
        endpoint: http://image-provider:8081/status
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            cors:
              allowed_origins:
              - http://*
              - https://*
            endpoint: ${env:MY_POD_IP}:4318
      postgresql:
        endpoint: postgresql:5432
        metrics:
          postgresql.blks_hit:
            enabled: true
          postgresql.blks_read:
            enabled: true
          postgresql.deadlocks:
            enabled: true
          postgresql.tup_deleted:
            enabled: true
          postgresql.tup_fetched:
            enabled: true
          postgresql.tup_inserted:
            enabled: true
          postgresql.tup_returned:
            enabled: true
          postgresql.tup_updated:
            enabled: true
        password: otel
        tls:
          insecure: true
        username: root
      prometheus:
        config:
          scrape_configs:
          - job_name: opentelemetry-collector
            scrape_interval: 10s
            static_configs:
            - targets:
              - ${env:MY_POD_IP}:8888
      redis:
        collection_interval: 10s
        endpoint: valkey-cart:6379
        username: valkey
      zipkin:
        endpoint: ${env:MY_POD_IP}:9411
    service:
      extensions:
      - health_check
      pipelines:
        logs:
          exporters:
          - opensearch
          - debug
          processors:
          - k8sattributes
          - memory_limiter
          - resourcedetection
          - resource
          - batch
          receivers:
          - otlp
        metrics:
          exporters:
          - otlphttp/prometheus
          - debug
          processors:
          - k8sattributes
          - memory_limiter
          - resourcedetection
          - resource
          - batch
          receivers:
          - httpcheck/frontend-proxy
          - nginx
          - otlp
          - postgresql
          - redis
          - spanmetrics
        traces:
          exporters:
          - otlp
          - debug
          - spanmetrics
          - otlp/sre-agent
          processors:
          - k8sattributes
          - memory_limiter
          - resourcedetection
          - resource
          - transform
          - batch
          receivers:
          - otlp
          - jaeger
          - zipkin
      telemetry:
        metrics:
          level: detailed
          readers:
          - periodic:
              exporter:
                otlp:
                  endpoint: otel-collector:4318
                  protocol: http/protobuf
              interval: 10000
              timeout: 5000
