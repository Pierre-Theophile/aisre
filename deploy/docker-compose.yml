#
# Local PostgreSQL for development, tests and the quickstart.
#
#   docker compose -f deploy/docker-compose.yml up -d postgres
#   export PG_DSN='postgres://sreagent:sreagent@localhost:5432/sreagent?sslmode=disable'
#
# See deploy/README.md. This file is for laptops and CI only; it is not a production
# deployment and has no TLS, no tuned resources and a well-known password.

name: sre-agent

services:
  postgres:
    # Postgres 16+ is required: the bitemporal tables use range types with GiST exclusion
    # constraints (research §2, §3).
    image: postgres:16-alpine
    container_name: sre-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sreagent
      POSTGRES_PASSWORD: sreagent
      POSTGRES_DB: sreagent
      # Deterministic ordering and timestamps across developer machines, so that golden
      # fixtures compare byte for byte wherever they are produced.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone returns true while the init scripts still run; asking the database
      # a question is what tells us it is actually usable.
      test: ["CMD-SHELL", "pg_isready -U sreagent -d sreagent && psql -U sreagent -d sreagent -c 'select 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    command:
      - postgres
      - "-c"
      - "max_connections=100"
      - "-c"
      - "log_min_duration_statement=500"

volumes:
  postgres-data:
    name: sre-agent-postgres-data
