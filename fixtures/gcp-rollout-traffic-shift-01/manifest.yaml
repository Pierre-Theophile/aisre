id: gcp-rollout-traffic-shift-01
family: gcp-rollout
description: 'A revision created at 14:18 and given 100% of the traffic at 14:20, asserting **two** rollout changes at those two distinct instants: the creation at the API''s createTime marked as not having moved traffic, and the shift at the operation.last audit entry''s timestamp marked as having moved it. The request entry at 14:19:30 is present and is deliberately not the answer — dating from it would put the change at the moment somebody pressed deploy rather than the moment production served differently. Synthetic structural twin: no identifier is derived from the organisation (contracts/sanitisation.md §7), and constitution VIII says synthetic-only data is not enough for a connector to be marked stable — US7''s recording replaces it by swapping payloads/, not by changing code.'
schema_version: 1.0.0
sdk_version: 0.1.0
hand_authored: false
events: events.jsonl
sources:
    - source_id: gcp:twin
      kind: gcp
      ordering: none
      reordering_window: 10m0s
clock:
    start: 2026-09-21T14:00:00Z
    end: 2026-09-21T15:30:00Z

queries:
  # The two rollouts, at their two instants. A diff over the window that contains both must list
  # both, and the one that moved traffic must be distinguishable from the one that did not.
  - name: storefront-diff-over-the-deploy
    kind: diff
    focus: gcp.cloudrun.service=twin-production/europe-west1/storefront
    t1: 2026-09-21T14:17:00Z
    t2: 2026-09-21T14:21:00Z
    observed_at: 2026-09-21T20:00:00Z
    hops: 2
    direction: both
  # A window that ends between the two instants: the creation is a candidate, the shift is not yet.
  # This is the query that fails if both changes share an instant.
  - name: storefront-diff-between-the-two-instants
    kind: diff
    focus: gcp.cloudrun.service=twin-production/europe-west1/storefront
    t1: 2026-09-21T14:17:00Z
    t2: 2026-09-21T14:19:00Z
    observed_at: 2026-09-21T20:00:00Z
    hops: 2
    direction: both
  # What was serving at 14:19 — after the revision was created and before traffic moved.
  - name: storefront-asof-1419
    kind: subgraph
    focus: gcp.cloudrun.service=twin-production/europe-west1/storefront
    valid_at: 2026-09-21T14:19:00Z
    observed_at: 2026-09-21T20:00:00Z
    hops: 1
    direction: both
