# Hand-authored fixture: the agent says unknown rather than guess (feature 009 T026, FR-030–FR-032).
id: ambiguous-01
family: conformance
description: >-
  009 US4: four monitors, and only one of them has evidence enough.

  The catalog has *Search*, *Search Web* and *Billing*, and says the Cloud SQL instance
  `billing-db` is Billing's. Nothing in it names the workloads the monitors watch, so layer 1 has
  nothing to say and every decision is layer 2's.

  - 301 watches an uptime target, `10.0.3.7`: no rule fires. `unknown`, nothing suggested.
  - 302 watches `search-api`, which is *Search* and *Search Web* alike by name (`P1`, 0.85 each:
    `web` is a deployment suffix). The lead is 0, under δ: `unknown`, both suggested.
  - 303 watches `ledger-sync`, which depends on `billing-db` (`P3`, 0.55). Under τ: `unknown`,
    *Billing* suggested. Topology alone is a hint, never a decision.
  - 304 watches `billing-invoice-api`: its name shares a token with *Billing* (`P2`, J = 0.5,
    0.65), it depends on `billing-db` (`P3`, 0.55) and has its owner (`P4`, 0.50). By noisy-OR,
    1 − 0.35 × 0.45 × 0.50 = 0.92125 (recorded to four places, 0.9213), over τ with nothing else
    scoring: *Billing*, at layer 2.

  None of the watched entities is a SERVICE, so discovery proposes nothing.
