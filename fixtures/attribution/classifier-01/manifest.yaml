# Hand-authored fixture: the classifier reads what the rules cannot (feature 009 T035, research R6).
id: classifier-01
family: conformance
description: >-
  009 US5: ten monitors on workloads whose names say nothing (`svc-a1` to `svc-j0`), and a catalog
  of five entries described in words. No alias, no shared word, no topology and no owner: layers
  0 to 2 leave every monitor `unknown`, and layer 3 reads the alert titles against the entries'
  descriptions through the embedding classifier, replayed from vectors.jsonl. Eight titles are
  about one entry; two (disk pressure, an ingress certificate) are about none, and must stay
  `unknown`.

  The calibration in classifier.yaml was fitted on this case. With it the classifier attributes
  the five clearest titles at 0.90 to 0.95 and leaves three it reads correctly but less surely
  (0.51 to 0.69) as suggestions; the two about nothing score under 0.04. At 10:45 Pierre says
  503 (SMS delivery) is *Notifications*.
schema_version: 1.0.0
sdk_version: 0.1.0
hand_authored: true
events: events.jsonl

sources:
  - source_id: k8s:shop
    kind: kubernetes
    ordering: none
    reordering_window: 0s
  - source_id: datadog:demo
    kind: datadog
    ordering: none
    reordering_window: 30s
  - source_id: sre.attributor
    kind: attributor
    ordering: none
    reordering_window: 0s

clock:
  start: 2026-10-05T08:50:00Z
  end:   2026-10-05T11:00:00Z

