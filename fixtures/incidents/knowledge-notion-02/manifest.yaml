# Hand-authored fixture. See fixtures/incidents/README.md.
id: knowledge-notion-02
family: conformance
description: >-
  008 US1, lexical only: an investigation finds an earlier postmortem by a symptom that its
  registered summary never carried. The graph is knowledge-notion-01's -- the same incident (a
  payments rollout at 14:20, checkout's alert at 14:32) and the same three Notion postmortems,
  registered the way `aisre feed notion` registers them. What is new is documents.yaml: the
  sections of those three pages as fixtures/notion-knowledge-twin-02 records them, generated
  from that recording by internal/feeders/notion/twin02_test.go and put at the instants the
  feeder sent them.

  - `Checkout 5xx after a payments rollout` CONCERNS checkout and payments. Its "Signals /
    Symptoms" property names ECONNRESET and HikariCP only after
    its 600th character, past where 007's summary was cut, and nowhere else. It is the one to
    cite, with `section_label` "Signals / Symptoms", by a search for those two words;
  - `Reporting nightly` CONCERNS reporting only and matches neither word;
  - `Checkout 5xx on 2026-09-01` has the same symptoms but was written at 14:35 and its
    sections stored at 15:00, after the alert: it is never returned for it.

  The retrieval is lexical only: no embedding provider is configured (008 FR-024).
schema_version: 1.0.0
sdk_version: 0.1.0
hand_authored: true
events: events.jsonl

sources:
  - source_id: otel:demo
    kind: otel
    ordering: none
    reordering_window: 30s
  - source_id: k8s:demo
    kind: k8s
    ordering: per_source_sequence
    reordering_window: 60s
  - source_id: notion:twin
    kind: notion
    ordering: none
    reordering_window: 0s

clock:
  start: 2026-09-01T13:00:00Z
  end:   2026-09-01T14:40:00Z

queries:
  - name: reporting-1hop-1432
    kind: subgraph
    focus: otel.service.name=reporting
    valid_at: 2026-09-01T14:32:00Z
    hops: 1
    direction: both
  - name: checkout-diff
    kind: diff
    focus: otel.service.name=checkout
    t1: 2026-09-01T13:00:00Z
    t2: 2026-09-01T14:32:00Z
    hops: 2
    direction: both
  - name: checkout-2hop-1432
    kind: subgraph
    focus: otel.service.name=checkout
    valid_at: 2026-09-01T14:32:00Z
    hops: 2
    direction: both

incident:
  question:
    transport: monitor
    origin_system: datadog
    origin_ref: "monitor:20110:group=env:prod"
    statement: "checkout error rate above 5 % for 5 minutes"
    fired_at: 2026-09-01T14:32:00Z
    subject: otel.service.name=checkout
    lookback: 90m
    profile: page

  ground_truth:
    culprit: k8s.change=shop/payments@rev7
    causal_path:
      - entity: k8s.change=shop/payments@rev7
        via: changed-by
        role: cause
      - entity: otel.service.name=payments
        via: calls
        role: mechanism
      - entity: otel.service.name=checkout
        role: symptom

    decisive_evidence:
      - term:
          errors_by_version:
            pointer: "METRIC otel.service.name=payments"
            window: "2026-09-01T14:20:00Z..2026-09-01T14:32:00Z"
            version_attribute: service.version
        field_path: versions[version=rev7].error_rate
        op: gt
        value: 0.05
        note: the new revision carries the errors; askable only because the metric pointer publishes a version join key.
      - term:
          compare:
            pointer: "METRIC otel.service.name=payments"
            windows: {reference_at: 2026-09-01T14:20:00Z, width_seconds: 900}
            statistic: ERROR_RATE
        field_path: comparisons[statistic=ERROR_RATE].direction
        op: eq
        value: up
        note: payments' error rate rises across the onset by more than an order of magnitude.
      - term:
          error_spans:
            src: otel.service.name=checkout
            dst: otel.service.name=payments
            edge_type: CALLS
            window: "2026-09-01T14:20:00Z..2026-09-01T14:32:00Z"
        field_path: groups[error_kind=deadline_exceeded].join_keys.version
        op: eq
        value: rev7
        note: the failing spans on the call path from the alerting service carry the new version.
      - term:
          knowledge_search:
            entity_ids: [otel.service.name=checkout, otel.service.name=payments]
            query_terms: [ECONNRESET, HikariCP]
            limit: 10
        field_path: knowledge.items[*].document_id
        op: contains
        value: notion.page=c3000000-0000-4000-8000-000000000001
        note: >-
          the May postmortem is found by two words that appear only in its "Signals / Symptoms"
          section, after its 600th character: 007's summary could not have found it.
      - term:
          knowledge_search:
            entity_ids: [otel.service.name=checkout, otel.service.name=payments]
            query_terms: [ECONNRESET, HikariCP]
            limit: 10
        field_path: knowledge.items[document_id=notion.page=c3000000-0000-4000-8000-000000000001].section_label
        op: eq
        value: Signals / Symptoms
        note: the citation names the section that matched, so a reader opens the page at it.
      - term:
          knowledge_search:
            entity_ids: [otel.service.name=checkout, otel.service.name=payments]
            query_terms: [ECONNRESET, HikariCP]
            limit: 10
        field_path: knowledge.items
        op: not_contains
        value: notion.page=c3000000-0000-4000-8000-000000000003
        note: >-
          the postmortem written after the alert carries the same symptoms, but neither it nor
          its sections were known at 14:32; it is never returned.

    decoys: []
    exonerating_evidence: {}

    # Nobody sees the future: this investigation observes the world at `fired_at` (14:32), so the
    # decisive windows above end there and no predicate rests on telemetry after it
    # (constitution II). The evidence itself exists earlier: the onset is 14:20, and the five
    # one-minute samples after it — `onset.MinSustainedPoints`, the shortest run this project
    # calls a symptom — are complete at 14:25, by which instant rev7's error rate over them is
    # an order of magnitude above the 5 % floor the predicate asks for. Asked before 14:25,
    # `unknown` is the correct answer and naming payments is a lucky guess.
    knowability_time: 2026-09-01T14:25:00Z
    onset: {at: 2026-09-01T14:20:00Z, tolerance_seconds: 120}
    prior_rank_of_culprit: 1
    provenance:
      kind: synthetic
      sanitiser_policy_version: "1.0.0"

  world:
    hop_radius: 2
    drill_down_depth: 1
    window_grid:
      - {reference_at: 2026-09-01T14:20:00Z, width_seconds: 900}
    algebra_version: "1.0.0"
    miss_rate_threshold: 0.05
    note: >-
      One grid entry centred on the estimated onset. The world is the cross product of
      (pointers in the neighbourhood) x (grid) x (the recorder's statistic set: ERROR_RATE,
      P95, RATE) plus monitor_state, log patterns, onset, errors_by_version where a version
      join key exists, error_spans per edge, and the depth-1 drill-downs those answers mint,
      so each further grid entry doubles the directory. The cap is the grid, the hop radius
      and the drill-down depth; all three are read back from this block by
      `fixture record-world`, so widening one is an edit a reviewer sees.

  runs: 3
