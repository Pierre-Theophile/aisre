# Hand-authored fixture. See fixtures/incidents/README.md.
id: unknown-feeder-gap-01
family: feeder-gap
description: >-
  FR-032, FR-062 and SC-007: the window the question is about overlaps a hole in one source's
  coverage, so the honest answer is `unknown` -- naming the gap and the action that would
  resolve it -- rather than a ranked list computed over events nobody had yet.

  The Kubernetes feeder checkpoints healthy coverage to 14:05 and then stops. payments is
  rolled out to revision 7 at 14:20, inside the hole. The monitor on checkout fires at 14:32.
  At 14:40 the feeder reconnects, checkpoints `gap_before` over [14:05, 14:40) and backfills
  the rollout with its true valid time of 14:20 and an observed time of 14:40:30.

  So the fixture holds one incident and two correct answers, and which one is correct depends
  entirely on when you ask:

  - as known at 14:32 -- the instant the alert fired -- the rollout has not been observed. The
    diff over checkout's neighbourhood is empty (`diff.checkout-diff-asknown-1432`), `extent`
    reports the gap, and the correct outcome is `unknown` with the gap named. Naming payments
    here would be a lucky guess scored as a failure;
  - as known now, the rollout is there (`diff.checkout-diff-now`) and it is the culprit.

  `knowability_time` is 14:40:30, which is after `fired_at`, and that single field is what
  makes the first answer correct rather than merely cautious (contracts/incident-format.md,
  "knowability_time makes unknown correct").

  Hand-authored rather than derived from `feeder-gap-01` on purpose. That fixture is a
  recording of the feeder NOT reporting its gap -- its reconnection checkpoint carries no
  `gap_before` and `extent` reports zero gaps, which is the bug it was shipped to pin. A
  fixture that needs the gap to be nameable cannot be derived from a recording in which it
  is not.
schema_version: 1.0.0
sdk_version: 0.1.0
hand_authored: true
events: events.jsonl

sources:
  - source_id: otel:demo
    kind: otel
    ordering: none
    reordering_window: 30s
  - source_id: k8s:demo
    kind: k8s
    ordering: per_source_sequence
    reordering_window: 60s

clock:
  start: 2026-09-01T13:00:00Z
  end:   2026-09-01T14:45:00Z

queries:
  - name: extent
    kind: extent
  # The same diff twice, differing only in observed time, and they must differ in result.
  - name: checkout-diff-asknown-1432
    kind: diff
    focus: otel.service.name=checkout
    t1: 2026-09-01T13:00:00Z
    t2: 2026-09-01T14:32:00Z
    observed_at: 2026-09-01T14:32:00Z
    hops: 2
    direction: both
  - name: checkout-diff-now
    kind: diff
    focus: otel.service.name=checkout
    t1: 2026-09-01T13:00:00Z
    t2: 2026-09-01T14:32:00Z
    hops: 2
    direction: both
  - name: checkout-2hop-1432
    kind: subgraph
    focus: otel.service.name=checkout
    valid_at: 2026-09-01T14:32:00Z
    hops: 2
    direction: both

incident:
  question:
    transport: monitor
    origin_system: datadog
    origin_ref: "monitor:20106:group=env:prod"
    statement: "checkout error rate above 5 % for 5 minutes"
    fired_at: 2026-09-01T14:32:00Z
    subject: otel.service.name=checkout
    lookback: 90m
    profile: page

  ground_truth:
    culprit: k8s.change=shop/payments@rev7
    causal_path:
      - entity: k8s.change=shop/payments@rev7
        via: changed-by
        role: cause
      - entity: otel.service.name=payments
        via: calls
        role: mechanism
      - entity: otel.service.name=checkout
        role: symptom

    decisive_evidence:
      - term:
          graph:
            extent: {}
        field_path: sources[source_id=k8s:demo].gaps.length
        op: gte
        value: 1
        note: >-
          the gap itself, as the graph reports it. An investigation asked at 14:32 has to reach
          this answer and stop: the resolving action is to wait for the feeder to catch up, and
          `extent` is where it learns that there is something to wait for.
      - term:
          graph:
            diff:
              focus: otel.service.name=checkout
              t1: 2026-09-01T13:00:00Z
              t2: 2026-09-01T14:32:00Z
              observed_at: 2026-09-01T14:32:00Z
              hops: 2
        field_path: changes.length
        op: eq
        value: 0
        note: >-
          as known at the alert instant there is no candidate at all. This is the positive
          statement of "unknown": not "nothing was found" but "nothing had been observed".
      - term:
          errors_by_version:
            pointer: "METRIC otel.service.name=payments"
            window: "2026-09-01T14:20:00Z..2026-09-01T14:32:00Z"
            version_attribute: service.version
        field_path: versions[version=rev7].error_rate
        op: gt
        value: 0.05
        note: the new revision carries the errors; askable only because the metric pointer publishes a version join key.
      - term:
          compare:
            pointer: "METRIC otel.service.name=payments"
            windows: {reference_at: 2026-09-01T14:20:00Z, width_seconds: 900}
            statistic: ERROR_RATE
        field_path: comparisons[statistic=ERROR_RATE].direction
        op: eq
        value: up
        note: payments' error rate rises across the onset by more than an order of magnitude.
      - term:
          error_spans:
            src: otel.service.name=checkout
            dst: otel.service.name=payments
            edge_type: CALLS
            window: "2026-09-01T14:20:00Z..2026-09-01T14:32:00Z"
        field_path: groups[error_kind=deadline_exceeded].join_keys.version
        op: eq
        value: rev7
        note: the failing spans on the call path from the alerting service carry the new version.

    decoys: []
    exonerating_evidence: {}

    # After the alert instant, deliberately. Before it the correct answer is `unknown` with
    # the gap named; after it the decisive evidence above exists and the culprit is knowable.
    knowability_time: 2026-09-01T14:40:30Z
    onset: {at: 2026-09-01T14:20:00Z, tolerance_seconds: 120}
    # The prior ranks nothing at the alert instant, because it can see nothing.
    prior_rank_of_culprit: 0
    provenance:
      kind: synthetic
      sanitiser_policy_version: "1.0.0"

  world:
    hop_radius: 2
    drill_down_depth: 1
    window_grid:
      - {reference_at: 2026-09-01T14:20:00Z, width_seconds: 900}
    algebra_version: "1.0.0"
    miss_rate_threshold: 0.05
    note: >-
      One grid entry centred on the estimated onset. The world is the cross product of
      (pointers in the neighbourhood) x (grid) x (the recorder's statistic set: ERROR_RATE,
      P95, RATE) plus monitor_state, log patterns, onset, errors_by_version where a version
      join key exists, error_spans per edge, and the depth-1 drill-downs those answers mint,
      so each further grid entry doubles the directory. The cap is the grid, the hop radius
      and the drill-down depth; all three are read back from this block by
      `fixture record-world`, so widening one is an edit a reviewer sees.

  runs: 3
