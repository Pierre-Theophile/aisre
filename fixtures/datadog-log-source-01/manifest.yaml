# Recorded fixture. See fixtures/README.md and contracts/fixture-format.md.
#
# Add a `queries:` list naming the reads whose answers golden/ must hold, then run
# `aisre fixture record` to write them and `aisre fixture verify` to check them.
id: datadog-log-source-01
family: datadog-cross-source
description: 'A node and a pointer for every watched Datadog log source. `checkout` stamps its version with the `version` tag, so its datadog-logs/v1 pointer''s version join key is `version`; Cloud Run also runs `checkout` under the same OpenTelemetry name and environment, C9 merges them, and the merged entity carries both connectors'' pointers. `search` carries only an SDK''s own `@version` on a handful of start-up lines, which the share test rejects: its pointer has no version join key and its verdict says why. `payments` has no stamp from 13:00 to 14:00 and one from 14:00 to 15:00, so its pointer gains the join key from the 15:00 tick, and an as-of read either side shows each. Synthetic structural twin: no identifier is derived from the organisation.'
schema_version: 1.0.0
sdk_version: 0.1.0
hand_authored: false
events: events.jsonl
sources:
    - source_id: datadog:twin
      kind: datadog
      ordering: none
      reordering_window: 10m0s
    - source_id: gcp:twin
      kind: gcp
      ordering: none
      reordering_window: 10m0s
clock:
    start: 2026-09-21T13:59:00Z
    end: 2026-09-21T16:00:00Z


queries:
  # FR-039: on the merged entity, Datadog's log pointer is added to Cloud Run's, not substituted.
  - name: checkout-pointers-merged
    kind: pointers
    focus: datadog.service=production/checkout
    valid_at: 2026-09-21T15:30:00Z
    observed_at: 2026-09-21T16:00:00Z
  - name: why-the-log-service-is-the-cloud-run-service
    kind: audit
    ref_a: datadog.service=production/checkout
    ref_b: gcp.cloudrun.service=twin-production/europe-west1/checkout
    observed_at: 2026-09-21T16:00:00Z
  # The unstamped source: a pointer with no version join key, and the verdict naming why.
  - name: search-unstamped
    kind: subgraph
    focus: datadog.service=production/search
    valid_at: 2026-09-21T15:30:00Z
    observed_at: 2026-09-21T16:00:00Z
    hops: 0
    direction: both
  # FR-038: the pointer as of each side of the verdict change.
  - name: payments-pointers-before-the-stamp
    kind: pointers
    focus: datadog.service=production/payments
    valid_at: 2026-09-21T14:30:00Z
    observed_at: 2026-09-21T16:00:00Z
  - name: payments-pointers-after-the-stamp
    kind: pointers
    focus: datadog.service=production/payments
    valid_at: 2026-09-21T15:30:00Z
    observed_at: 2026-09-21T16:00:00Z
