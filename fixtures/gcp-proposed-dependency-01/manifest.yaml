id: gcp-proposed-dependency-01
family: gcp-cloudsql
description: 'A Cloud SQL instance that nothing in any service''s configuration names, and a service whose environment-variable name resembles it. No depends-on edge is asserted — the subgraph golden is where that absence is checked — and one proposed dependency is raised carrying its evidence, its score and its rule, once per cycle. Also holds the GKE cluster as an INFRA_RESOURCE with the bare name the Kubernetes connector uses, and nothing below it: the payload carries a node pool and the graph must not. Synthetic structural twin: no identifier is derived from the organisation (contracts/sanitisation.md §7), and constitution VIII says synthetic-only data is not enough for a connector to be marked stable — US7''s recording replaces it by swapping payloads/, not by changing code.'
schema_version: 1.0.0
sdk_version: 0.1.0
hand_authored: false
events: events.jsonl
sources:
    - source_id: gcp:twin
      kind: gcp
      ordering: none
      reordering_window: 10m0s
clock:
    start: 2026-09-21T14:00:00Z
    end: 2026-09-21T15:00:00Z

queries:
  # The service's neighbourhood. The instance must NOT be in it: a proposal is never an edge, and no
  # query traverses one (FR-029).
  - name: storefront-2hop
    kind: subgraph
    focus: gcp.cloudrun.service=twin-production/europe-west1/storefront
    valid_at: 2026-09-21T20:00:00Z
    observed_at: 2026-09-21T20:00:00Z
    hops: 2
    direction: both
  # The instance's neighbourhood, from the other side, for the same reason.
  - name: ledger-2hop
    kind: subgraph
    focus: gcp.cloudsql.instance=twin-production/europe-west1/billing-ledger
    valid_at: 2026-09-21T20:00:00Z
    observed_at: 2026-09-21T20:00:00Z
    hops: 2
    direction: both
  # The cluster, and nothing below it (FR-030).
  - name: cluster-2hop
    kind: subgraph
    focus: gcp.gke.cluster=twin-production/europe-west1/inference
    valid_at: 2026-09-21T20:00:00Z
    observed_at: 2026-09-21T20:00:00Z
    hops: 2
    direction: both
  - name: extent
    kind: extent
    observed_at: 2026-09-21T20:00:00Z
