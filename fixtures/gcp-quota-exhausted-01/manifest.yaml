# Recorded fixture. See fixtures/README.md and contracts/fixture-format.md.
#
# Add a `queries:` list naming the reads whose answers golden/ must hold, then run
# `sre-agent fixture record` to write them and `sre-agent fixture verify` to check them.
id: gcp-quota-exhausted-01
family: gcp-budget
description: 'A complete poll followed by one the call budget cut short: the checkpoint states the areas dropped from the published deferral order, the typed stop reason quota_exhausted — which is never evidence of absence — and the gap. The partial poll retracts nothing, so the topology the first cycle observed is still there afterwards, which is what keeps a quota squeeze from looking like the estate being deleted. Synthetic structural twin: no identifier is derived from the organisation (contracts/sanitisation.md §7), and constitution VIII says synthetic-only data is not enough for a connector to be marked stable — US7''s recording replaces it by swapping payloads/, not by changing code.'
schema_version: 1.0.0
sdk_version: 0.1.0
hand_authored: false
events: events.jsonl
sources:
    - source_id: gcp:twin
      kind: gcp
      ordering: none
      reordering_window: 10m0s
clock:
    start: 2026-09-21T14:00:00Z
    end: 2026-09-21T15:00:00Z

queries:
  # The extent, which is the whole fixture: the scope, the deferred areas, the stop reason and the gap.
  - name: extent
    kind: extent
    observed_at: 2026-09-21T20:00:00Z
  # And the topology, which a partial poll must leave exactly as it was (§8.1). A retraction here
  # would be the failure this rule exists to prevent.
  - name: storefront-2hop
    kind: subgraph
    focus: gcp.cloudrun.service=twin-production/europe-west1/storefront
    valid_at: 2026-09-21T20:00:00Z
    observed_at: 2026-09-21T20:00:00Z
    hops: 2
    direction: both
