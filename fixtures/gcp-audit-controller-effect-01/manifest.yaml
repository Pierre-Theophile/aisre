id: gcp-audit-controller-effect-01
family: gcp-audit
description: 'An autoscaling adjustment four minutes after symptom onset, emitted as a SCALING change valid at the instant GCP states — so a diff window opening at onset finds it after the symptom rather than before it, which is what lets feature 002''s causal ordering treat it as a candidate effect. The actor kind CONTROLLER is NOT asserted here: it rests on serviceAccountDelegationInfo[].firstPartyPrincipal, the only documented signal that a caller is a Google platform agent, and a sanitised entry carries no such field at all (FR-135) — so that half is asserted from memory in this package''s tests. Synthetic structural twin: no identifier is derived from the organisation (contracts/sanitisation.md §7), and constitution VIII says synthetic-only data is not enough for a connector to be marked stable — US7''s recording replaces it by swapping payloads/, not by changing code.'
schema_version: 1.0.0
sdk_version: 0.1.0
hand_authored: false
events: events.jsonl
sources:
    - source_id: gcp:twin
      kind: gcp
      ordering: none
      reordering_window: 10m0s
clock:
    start: 2026-09-21T14:00:00Z
    end: 2026-09-21T15:00:00Z

queries:
  # The window from onset onwards: the scaling change is inside it, four minutes in.
  - name: storefront-diff-from-onset
    kind: diff
    focus: gcp.cloudrun.service=twin-production/europe-west1/storefront
    t1: 2026-09-21T14:20:00Z
    t2: 2026-09-21T20:00:00Z
    observed_at: 2026-09-21T20:00:00Z
    hops: 2
    direction: both
  # The window that ENDS at onset: the scaling change is not in it, which is the assertion that makes
  # "candidate effect" mean something — a change after the symptom cannot have caused it.
  - name: storefront-diff-before-onset
    kind: diff
    focus: gcp.cloudrun.service=twin-production/europe-west1/storefront
    t1: 2026-09-21T14:00:00Z
    t2: 2026-09-21T14:20:00Z
    observed_at: 2026-09-21T20:00:00Z
    hops: 2
    direction: both
    expect_empty: "the window ends at onset and the scaling change comes after it, so nothing is in it: a change after the symptom cannot have caused it, and that absence is what makes candidate effect mean something"
  - name: extent
    kind: extent
    observed_at: 2026-09-21T20:00:00Z
