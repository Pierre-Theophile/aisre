id: gcp-grouped-alert-01
family: gcp-alerts
description: 'A policy grouped by revision, with both revisions alerting: two alerting groups produce exactly two alerts, each with its own state history naming its policy, and the policy-level entity is never reported as alerting because a group is (SC-005). The old revision recovers and the new one does not, which is the shape that makes "the new revision is failing and the old one is not" a fact the graph states rather than a comparison a reader has to make. The alerting entity is the GROUP because the projector writes an alert''s state onto the node its monitor ref names: two groups sharing one ref would mean the last poll wins, and an investigation asking whether the alert is firing would get whichever group was read last. Synthetic structural twin: no identifier is derived from the organisation (contracts/sanitisation.md §7), and constitution VIII says synthetic-only data is not enough for a connector to be marked stable — US7''s recording replaces it by swapping payloads/, not by changing code.'
schema_version: 1.0.0
sdk_version: 0.1.0
hand_authored: false
events: events.jsonl
sources:
    - source_id: gcp:twin
      kind: gcp
      ordering: none
      reordering_window: 10m0s
clock:
    start: 2026-09-21T14:00:00Z
    end: 2026-09-21T15:30:00Z

queries:
  # Both groups, and the policy. Three ALERT nodes: the definition and one per group.
  - name: grouped-alert-2hop
    kind: subgraph
    focus: gcp.monitoring.alert_policy=projects/twin-production/alertPolicies/5566778899
    valid_at: 2026-09-21T20:00:00Z
    observed_at: 2026-09-21T20:00:00Z
    hops: 2
    direction: both
  # The old revision's group, which recovered, and the new one's, which did not. Two focused reads
  # rather than one history read, because those are the kinds this build's fixture recorder
  # supports. They make the fixture's own point: the two groups have separate states.
  - name: grouped-alert-old-revision
    kind: subgraph
    focus: gcp.monitoring.alert_policy=projects/twin-production/alertPolicies/5566778899#resource.labels.revision_name=storefront-00041-aaa
    valid_at: 2026-09-21T20:00:00Z
    observed_at: 2026-09-21T20:00:00Z
    hops: 1
    direction: both
  - name: grouped-alert-new-revision
    kind: subgraph
    focus: gcp.monitoring.alert_policy=projects/twin-production/alertPolicies/5566778899#resource.labels.revision_name=storefront-00042-bbb
    valid_at: 2026-09-21T20:00:00Z
    observed_at: 2026-09-21T20:00:00Z
    hops: 1
    direction: both
