documents:
- ref: notion.page=pm-paiements-pool
  kind: postmortem
  title: Incident paiements du 4 juin
  summary: Les paiements ont échoué pendant dix-huit minutes.
  location: https://www.notion.so/pm-paiements-pool
  authored_at: '2026-06-04T09:00:00Z'
  links:
  - entity: otel.service.name=payments
    valid_from: '2026-06-04T09:00:00Z'
  puts:
  - at: '2026-06-04T09:00:00Z'
    sections:
    - label: Chronologie
      origin: body
      text: "14h05 l'astreinte a pris l'alerte et ouvert le tableau de bord. 14h09 un second ingénieur\
        \ a rejoint le canal d'incident. 14h14 le support a estimé l'impact client. 14h20 l'équipe a gelé\
        \ les déploiements. 14h05 l'astreinte a pris l'alerte et ouvert le tableau de bord. 14h09 un second\
        \ ingénieur a rejoint le canal d'incident. 14h14 le support a estimé l'impact client. 14h20 l'équipe\
        \ a gelé les déploiements. 14h05 l'astreinte a pris l'alerte et ouvert le tableau de bord. 14h09\
        \ un second ingénieur a rejoint le canal d'incident. 14h14 le support a estimé l'impact client.\
        \ 14h20 l'équipe a gelé les déploiements. "
    - label: Cause racine
      origin: body
      text: >-
        Le pool de connexions PostgreSQL du service payments était épuisé : la nouvelle révision gardait
        les connexions ouvertes pendant les appels au prestataire.
    - label: Résolution
      origin: body
      text: Retour à la révision précédente, puis limite de durée sur les connexions.
