documents:
- ref: notion.page=pm-cart-redis
  kind: postmortem
  title: Checkout errors in March
  summary: Checkout returned errors for twenty-five minutes; customers had to start over.
  location: https://www.notion.so/pm-cart-redis
  authored_at: '2026-03-18T09:00:00Z'
  links:
  - entity: otel.service.name=checkout
    valid_from: '2026-03-18T09:00:00Z'
  - entity: otel.service.name=cart
    valid_from: '2026-03-18T09:00:00Z'
  puts:
  - at: '2026-03-18T09:00:00Z'
    sections:
    - label: Timeline
      origin: body
      text: "14:05 the on-call engineer acknowledged the page and opened the service dashboard. 14:09\
        \ a second engineer joined the incident channel and started reading recent deploys. 14:14 the\
        \ incident commander asked for a customer impact estimate from support. 14:20 the team agreed\
        \ to hold all deploys until the cause was understood. 14:05 the on-call engineer acknowledged\
        \ the page and opened the service dashboard. 14:09 a second engineer joined the incident channel\
        \ and started reading recent deploys. 14:14 the incident commander asked for a customer impact\
        \ estimate from support. 14:20 the team agreed to hold all deploys until the cause was understood.\
        \ 14:05 the on-call engineer acknowledged the page and opened the service dashboard. 14:09 a second\
        \ engineer joined the incident channel and started reading recent deploys. 14:14 the incident\
        \ commander asked for a customer impact estimate from support. 14:20 the team agreed to hold all\
        \ deploys until the cause was understood. "
    - label: Root cause
      origin: body
      text: >-
        The cart cache reached Redis maxmemory and the allkeys-lru eviction policy evicted live cart sessions,
        so checkout could not find the cart it was paying for.
    - label: Resolution
      origin: body
      text: Raised maxmemory, moved sessions to a dedicated instance with noeviction.
