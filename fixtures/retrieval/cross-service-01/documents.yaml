documents:
- ref: notion.page=pm-billing-kafka
  kind: postmortem
  title: Billing invoices delayed
  summary: Invoices were sent two hours late.
  location: https://www.notion.so/pm-billing-kafka
  authored_at: '2026-05-22T09:00:00Z'
  links:
  - entity: otel.service.name=billing
    valid_from: '2026-05-22T09:00:00Z'
  puts:
  - at: '2026-05-22T09:00:00Z'
    sections:
    - label: Root cause
      origin: body
      text: >-
        A slow handler pushed poll intervals past max.poll.interval.ms, so the Kafka consumer group kept
        rebalancing and lag grew on every partition.
    - label: Resolution
      origin: body
      text: Raised max.poll.interval.ms and moved the slow call out of the handler.
