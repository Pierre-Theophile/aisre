- ref: notion.page=pm-checkout-dns
  kind: postmortem
  title: Checkout outage from DNS lookups
  summary: Checkout requests timed out for twenty minutes.
  location: https://www.notion.so/pm-checkout-dns
  authored_at: '2026-06-20T09:00:00Z'
  links:
  - entity: otel.service.name=checkout
    valid_from: '2026-06-20T09:00:00Z'
  puts:
  - at: '2026-06-20T09:00:00Z'
    sections:
    - label: Timeline
      origin: body
      text: "14:05 the on-call engineer acknowledged the page and opened the service dashboard. 14:09\
        \ a second engineer joined the incident channel and started reading recent deploys. 14:14 the\
        \ incident commander asked for a customer impact estimate from support. 14:20 the team agreed\
        \ to hold all deploys until the cause was understood. 14:05 the on-call engineer acknowledged\
        \ the page and opened the service dashboard. 14:09 a second engineer joined the incident channel\
        \ and started reading recent deploys. 14:14 the incident commander asked for a customer impact\
        \ estimate from support. 14:20 the team agreed to hold all deploys until the cause was understood. "
    - label: Root cause
      origin: body
      text: >-
        A resolver change set ndots to five, so every external lookup tried five search domains first
        and CoreDNS was overloaded.
- ref: notion.page=pm-auth-cert
  kind: postmortem
  title: Login failures after a certificate rotation
  summary: Users could not log in for fifteen minutes.
  location: https://www.notion.so/pm-auth-cert
  authored_at: '2026-05-02T09:00:00Z'
  links:
  - entity: otel.service.name=auth
    valid_from: '2026-05-02T09:00:00Z'
  puts:
  - at: '2026-05-02T09:00:00Z'
    sections:
    - label: Root cause
      origin: body
      text: >-
        The identity provider's certificate was rotated and the auth service pinned the old one, so every
        TLS handshake to the provider failed until the pin was updated.
    - label: Resolution
      origin: body
      text: Removed the certificate pin and redeployed auth.
