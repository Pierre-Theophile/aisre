- ref: notion.page=pm-cdn-purge
  kind: postmortem
  title: Broken checkout page in August
  summary: The checkout page failed to load for some users.
  location: https://www.notion.so/pm-cdn-purge
  authored_at: '2026-08-03T09:00:00Z'
  links:
  - entity: otel.service.name=checkout
    valid_from: '2026-08-03T09:00:00Z'
  - entity: otel.service.name=frontend
    valid_from: '2026-08-03T09:00:00Z'
  puts:
  - at: '2026-08-03T09:00:00Z'
    sections:
    - label: Root cause
      origin: body
      text: >-
        A partial CDN purge left stale JavaScript bundles in the cache that referenced assets the new
        deploy had removed.
