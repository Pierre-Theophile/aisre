documents:
- ref: notion.page=pm-inventory-deadlock
  kind: postmortem
  title: Inventory incident in June
  summary: Stock updates stalled for half an hour.
  location: https://www.notion.so/pm-inventory-deadlock
  authored_at: '2026-06-11T09:00:00Z'
  links:
  - entity: otel.service.name=inventory
    valid_from: '2026-06-11T09:00:00Z'
  puts:
  - at: '2026-06-11T09:00:00Z'
    sections:
    - label: Root cause
      origin: body
      text: >-
        A deadlock between reservation and restock transactions aborted every other inventory update.
  - at: '2026-09-02T09:00:00Z'
    sections:
    - label: Root cause
      origin: body
      text: >-
        Two transactions took row locks in opposite orders; fixed by a consistent lock order.
