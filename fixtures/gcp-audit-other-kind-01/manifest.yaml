id: gcp-audit-other-kind-01
family: gcp-audit
description: 'Five admin-activity entries covering FR-038''s minimum — an IAM policy change, a quota change, a service enablement, a secret version added and a resource deleted — mapped to the published taxonomy where one fits and to CHANGE_KIND_OTHER carrying GCP''s own operation name where none does. The deletion names a resource in no namespace this connector mints in, so its change carries the resource name and no target ref rather than minting a ref another connector owns. The twin''s entries carry no principal, because a sanitised entry has no such field at all (FR-135), so every actor here is unclassified and the ladder is asserted from memory in this package''s tests. Synthetic structural twin: no identifier is derived from the organisation (contracts/sanitisation.md §7), and constitution VIII says synthetic-only data is not enough for a connector to be marked stable — US7''s recording replaces it by swapping payloads/, not by changing code.'
schema_version: 1.0.0
sdk_version: 0.1.0
hand_authored: false
events: events.jsonl
sources:
    - source_id: gcp:twin
      kind: gcp
      ordering: none
      reordering_window: 10m0s
clock:
    start: 2026-09-21T14:00:00Z
    end: 2026-09-21T15:00:00Z

queries:
  # The service and the IAM change against it. Pinned, so the golden does not encode the day it was
  # recorded (fixture-format.md).
  - name: storefront-2hop
    kind: subgraph
    focus: gcp.cloudrun.service=twin-production/europe-west1/storefront
    valid_at: 2026-09-21T20:00:00Z
    observed_at: 2026-09-21T20:00:00Z
    hops: 2
    direction: both
  # Every change in the window, which is where the five kinds are checked — and where a change that
  # was dropped rather than mapped would be visible as an absence.
  - name: storefront-diff
    kind: diff
    focus: gcp.cloudrun.service=twin-production/europe-west1/storefront
    t1: 2026-09-21T14:00:00Z
    t2: 2026-09-21T20:00:00Z
    observed_at: 2026-09-21T20:00:00Z
    hops: 2
    direction: both
  # The extent, which states the audit scope in force: "no change happened" and "we were not looking
  # for that kind of change" are different answers (FR-040).
  - name: extent
    kind: extent
    observed_at: 2026-09-21T20:00:00Z
