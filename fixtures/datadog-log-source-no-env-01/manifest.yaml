id: datadog-log-source-no-env-01
family: datadog-log-sources
description: 'Where a service''s environment is carried, discovered rather than required. `payments` carries it as the `@env` attribute on 99.8% of its lines: it is measured and pointed at on `service:payments @env:production` and keeps its C9 claim. `search` is configured with --env-field @env. `worker` is watched without an environment and its logs carry `@env`: the checkpoint names the environments found. `ledger` is watched as `prod` while its `@env` says `staging`: the checkpoint names what exists. `checkout` and `billing` carry no environment field at all: missing env to match service. Synthetic structural twin: no identifier is derived from the organisation.'
schema_version: 1.0.0
sdk_version: 0.1.0
hand_authored: false
events: events.jsonl
sources:
    - source_id: datadog:twin
      kind: datadog
      ordering: none
      reordering_window: 10m0s
clock:
    start: 2026-09-21T12:59:00Z
    end: 2026-09-21T15:30:00Z

queries:
  # The discovered @env field: the pointer searches it, and the environment is kept.
  - name: payments-pointer-on-the-discovered-env-field
    kind: pointers
    focus: datadog.service=production/payments
    valid_at: 2026-09-21T15:10:00Z
    observed_at: 2026-09-21T15:30:00Z
  # An environment-less source: service alone.
  - name: checkout-pointer-without-an-environment
    kind: pointers
    focus: datadog.service=checkout
    valid_at: 2026-09-21T15:10:00Z
    observed_at: 2026-09-21T15:30:00Z
