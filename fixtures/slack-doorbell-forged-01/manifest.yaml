description: 'What a doorbell ring costs: at most one extra read of the channel list, and nothing else. `sev2-2026-10-14-checkout-latency` is created at 09:12:03. The doorbell-triggered poll at 09:12:05 reads it; a forged or replayed Socket Mode event, arriving once the bell''s rate limit has refilled, earns the extra poll at 09:12:40; and the next scheduled poll at 09:13:15 reads it again: three reads, one declaration, dated 09:12:03 (FR-011, SC-003). What the event said reaches nothing — internal/slackx/socket.go counts envelopes and never decodes their payload — and this fixture proves the other half, that an extra poll creates, alters and retracts nothing. Synthetic structural twin: no identifier is derived from the organisation.'
