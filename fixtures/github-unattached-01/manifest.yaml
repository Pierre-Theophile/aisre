description: 'A production deployment of a repository the operator''s mapping does not cover, emitted as ONE UNATTACHED change rather than dropped (Edge case 1). A deploy that happened is a fact whether or not this connector can say what it touched, and a target that appears later attaches through the projector''s pending queue rather than requiring the change to be re-observed. The change carries its commit claim, so the attachment can happen on the identifier rather than on a name. Synthetic structural twin: no identifier is derived from any organisation (contracts/sanitisation.md §7), and constitution VIII says synthetic-only data is not enough for a connector to be marked stable — a recording campaign replaces it by swapping payloads/, not by changing code.'
