# Recorded fixture. See fixtures/README.md and contracts/fixture-format.md.
#
# Add a `queries:` list naming the reads whose answers golden/ must hold, then run
# `sre-agent fixture record` to write them and `sre-agent fixture verify` to check them.
id: vendor-cancellation-01
family: vendor-notice
description: 'The same window, cancelled two days later. The cancellation is a correction of the same change: the observed interval closes and another opens on one ref, the valid interval is never rewritten, and "what did we believe on 18 September about 2 October?" stays answerable by an observed-time query. One change node, two recoverable beliefs. Synthetic structural twin: no identifier is derived from the organisation and no vendor it depends on appears (contracts/sanitisation.md §7). The payloads are already the sanitised form — the six typed fields and a pointer — because that is the shape the source emits, so no body and no sender exists to remove (FR-071, FR-072).'
schema_version: 1.0.0
sdk_version: 0.1.0
hand_authored: false
events: events.jsonl
sources:
    - source_id: vendor-notice:twin
      kind: vendor-notice
      ordering: none
      reordering_window: 6h0m0s
clock:
    start: 2026-09-17T10:00:00Z
    end: 2026-10-02T05:00:00Z

queries:
  # What we believed on 18 September: the window is announced. The cancellation was read on the
  # 19th, so an observed-time read before it must not see it — that recoverability is FR-067.
  - name: vendor-believed-18-september
    kind: subgraph
    focus: vendor=twin-gpu
    valid_at: 2026-10-02T03:00:00Z
    observed_at: 2026-09-18T12:00:00Z
    hops: 2
    direction: both
  # What we believe now: the same change, cancelled. One node, not two.
  - name: vendor-believed-now
    kind: subgraph
    focus: vendor=twin-gpu
    valid_at: 2026-10-02T03:00:00Z
    observed_at: 2026-09-20T12:00:00Z
    hops: 2
    direction: both
  # The change's own history, which is where both beliefs are visible side by side.
  - name: notice-history
    kind: history
    focus: vendor.notice=twin-gpu/TWIN-2026-1002
  - name: extent
    kind: extent
