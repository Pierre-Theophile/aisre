id: datadog-backend-apm-01
family: datadog-backend
description: 'The Datadog telemetry backend''s span and APM metric terms over a synthetic structural twin. `checkout` calls `payments`; at 14:10 a new version ships and the calls start failing with a timeout, slowly. Datadog retains two of every three spans and counts every one in its trace metrics, so error_spans (retained spans) and compare (trace metrics) disagree on a count by design and each coverage block says which surface answered. world/ is the cross product of the terms the apm_topology capability adds — compare over an APM metric pointer for every statistic it states, error_spans over the edge and over the empty reverse edge — and the two log answers that must not move; internal/backends/datadog asserts on every run that it answers every question exactly as the live twin does, and that with the capability off the twin is never asked for a span or a metric. Built against the published API shapes, not verified against a live organisation. Synthetic structural twin: no identifier is derived from any organisation.'
