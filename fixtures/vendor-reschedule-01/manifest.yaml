id: vendor-reschedule-01
family: vendor-notice
description: 'The same window, moved a week later. The superseded window and the new one are both recoverable by an observed-time query, and the reschedule creates no second change node: the vendor reused its identifier, so the correction addresses the same ref. Zero valid intervals are rewritten. Synthetic structural twin: no identifier is derived from the organisation and no vendor it depends on appears (contracts/sanitisation.md §7). The payloads are already the sanitised form — the six typed fields and a pointer — because that is the shape the source emits, so no body and no sender exists to remove (FR-071, FR-072).'
schema_version: 1.0.0
sdk_version: 0.1.0
hand_authored: false
events: events.jsonl
sources:
    - source_id: vendor-notice:twin
      kind: vendor-notice
      ordering: none
      reordering_window: 6h0m0s
clock:
    start: 2026-09-17T10:00:00Z
    end: 2026-10-02T05:00:00Z

queries:
  # The superseded window, as believed before the reschedule was read.
  - name: vendor-believed-18-september
    kind: subgraph
    focus: vendor=twin-gpu
    valid_at: 2026-10-02T03:00:00Z
    observed_at: 2026-09-18T12:00:00Z
    hops: 2
    direction: both
  # The new window, as believed after it.
  - name: vendor-believed-after-reschedule
    kind: subgraph
    focus: vendor=twin-gpu
    valid_at: 2026-10-09T03:00:00Z
    observed_at: 2026-09-21T12:00:00Z
    hops: 2
    direction: both
  # One change with both windows in its history.
  - name: notice-history
    kind: history
    focus: vendor.notice=twin-gpu/TWIN-2026-1002
  - name: extent
    kind: extent
