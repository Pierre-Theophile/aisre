# Recorded fixture. See fixtures/README.md and contracts/fixture-format.md.
#
# Add a `queries:` list naming the reads whose answers golden/ must hold, then run
# `sre-agent fixture record` to write them and `sre-agent fixture verify` to check them.
id: gcp-telemetry-rejection-01
family: gcp-refusal
description: 'The refusal path: three events carrying telemetry in a node property — an array of latency samples, a time series nested one level down, and a single metric value under a denied key — are each REJECTED with the published reason code `telemetry_payload`, and the service node they address is left carrying its pointers and no part of a digest anywhere. A pointer says where to look and never what was found (constitution IV); this fixture is what makes that an enforced rule rather than a convention, because the feeder under test would never emit one of these and a fixture built only from its own output could not tell the two apart. It also records the rule''s LIMIT, which a fixture that only showed successes would hide: a lone scalar such as `request_count: 48213` is NOT refused, because the check keys on shape and on the published denied-key list, and one number is indistinguishable from a replica count or a generation. That boundary is a stated property of the rule rather than an oversight, and it belongs where a reader meets it. Synthetic structural twin: no identifier is derived from the organisation (contracts/sanitisation.md §7), and constitution VIII says synthetic-only data is not enough for a connector to be marked stable — US7''s recording replaces it by swapping payloads/, not by changing code.'
schema_version: 1.0.0
sdk_version: 0.1.0
hand_authored: false
events: events.jsonl
sources:
    - source_id: gcp:twin
      kind: gcp
      ordering: none
      reordering_window: 10m0s
clock:
    start: 2026-09-21T14:00:00Z
    end: 2026-09-21T15:00:00Z
expect_rejected:
    - event_id: gcp:twin:telemetry-samples-1
      reason_code: telemetry_payload
    - event_id: gcp:twin:telemetry-denied-key-1
      reason_code: telemetry_payload
    - event_id: gcp:twin:telemetry-series-1
      reason_code: telemetry_payload
rejected_events: rejected.jsonl

queries:
  # The graph after the three refusals. The golden is the assertion: the service is here with its
  # pointers, and no property of it or of anything within two hops holds a measurement.
  - name: storefront-2hop-after-the-refusals
    kind: subgraph
    focus: gcp.cloudrun.service=twin-production/europe-west1/storefront
    valid_at: 2026-09-21T20:00:00Z
    observed_at: 2026-09-21T20:00:00Z
    hops: 2
    direction: both
