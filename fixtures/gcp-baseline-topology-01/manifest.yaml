# Recorded fixture. See fixtures/README.md and contracts/fixture-format.md.
#
# Add a `queries:` list naming the reads whose answers golden/ must hold, then run
# `sre-agent fixture record` to write them and `sre-agent fixture verify` to check them.
id: gcp-baseline-topology-01
family: gcp-topology
description: 'One Cloud Run service with two revisions, all traffic on the older one, observed by a single complete poll. Nothing changes, so every query at any instant after the first observation returns the same graph. Exercises the identifier namespaces with project and region in the value, the addressing ref being claimed, the label allowlist and the measurement rule, the OWNER node with an unknown valid start, and the pointers every node carries. Synthetic structural twin: no identifier is derived from the organisation (contracts/sanitisation.md §7), and constitution VIII says synthetic-only data is not enough for a connector to be marked stable — US7''s recording replaces it by swapping payloads/, not by changing code.'
schema_version: 1.0.0
sdk_version: 0.1.0
hand_authored: false
events: events.jsonl
sources:
    - source_id: gcp:twin
      kind: gcp
      ordering: none
      reordering_window: 10m0s
clock:
    start: 2026-09-21T14:00:00Z
    end: 2026-09-21T15:00:00Z

queries:
  # The serving topology as of the end of the clock. Pinned, so the golden does not encode the day
  # it was recorded (fixture-format.md).
  - name: storefront-2hop
    kind: subgraph
    focus: gcp.cloudrun.service=twin-production/europe-west1/storefront
    valid_at: 2026-09-21T20:00:00Z
    observed_at: 2026-09-21T20:00:00Z
    hops: 2
    direction: both
  # The pointers the service carries, which is what FR-079 is asserted against.
  - name: storefront-pointers
    kind: pointers
    focus: gcp.cloudrun.service=twin-production/europe-west1/storefront
    valid_at: 2026-09-21T20:00:00Z
    observed_at: 2026-09-21T20:00:00Z
  # The extent, which states the scope in force and the horizon: "not present" and "not in scope at
  # that time" are different answers (FR-009).
  - name: extent
    kind: extent
    observed_at: 2026-09-21T20:00:00Z
