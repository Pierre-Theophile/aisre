# Recorded fixture. See fixtures/README.md and contracts/fixture-format.md.
#
# Add a `queries:` list naming the reads whose answers golden/ must hold, then run
# `sre-agent fixture record` to write them and `sre-agent fixture verify` to check them.
id: gcp-cloudsql-scheduled-maintenance-01
family: gcp-cloudsql
description: 'A Cloud SQL instance read on 21 September announcing a maintenance window on 2 October: valid time leads observed time by eleven days, which is the same announced-fact shape as vendor-maintenance-future-01 from a platform feeder instead of a notice reader. Exercises the announced window emitted unchanged, observed time never moved forward to match it, the VENDOR actor kind, and the announcement state defaulting to announced and staying there while the window is ahead. Synthetic structural twin: no identifier is derived from the organisation (contracts/sanitisation.md §7), and constitution VIII says synthetic-only data is not enough for a connector to be marked stable — US7''s recording replaces it by swapping payloads/, not by changing code.'
schema_version: 1.0.0
sdk_version: 0.1.0
hand_authored: false
events: events.jsonl
sources:
    - source_id: gcp:twin
      kind: gcp
      ordering: none
      reordering_window: 10m0s
clock:
    start: 2026-09-21T14:00:00Z
    end: 2026-10-02T05:00:00Z

queries:
  # The instance and its announced change, as known on the day it was read. Pinned, so the golden
  # does not encode the day it was recorded (fixture-format.md).
  - name: instance-2hop-as-read
    kind: subgraph
    focus: gcp.cloudsql.instance=twin-production/europe-west1/orders-primary
    valid_at: 2026-10-02T03:00:00Z
    observed_at: 2026-09-21T17:00:00Z
    hops: 2
    direction: both
  # The same graph read during the announced window, eleven days after the poll. The change is valid
  # here and was observed eleven days earlier: an ordinary bitemporal read, which is FR-064's whole
  # claim.
  - name: instance-2hop-in-window
    kind: subgraph
    focus: gcp.cloudsql.instance=twin-production/europe-west1/orders-primary
    valid_at: 2026-10-02T03:00:00Z
    observed_at: 2026-10-02T03:00:00Z
    hops: 2
    direction: both
  # And read BEFORE the window, which must not return it as something that has happened: a change
  # whose valid start is after the reference instant is not a candidate cause (FR-065).
  - name: instance-2hop-before-window
    kind: subgraph
    focus: gcp.cloudsql.instance=twin-production/europe-west1/orders-primary
    valid_at: 2026-09-21T17:00:00Z
    observed_at: 2026-09-21T17:00:00Z
    hops: 2
    direction: both
  - name: extent
    kind: extent
    observed_at: 2026-09-21T17:00:00Z
