# Recorded fixture. See fixtures/README.md and contracts/fixture-format.md.
#
# Add a `queries:` list naming the reads whose answers golden/ must hold, then run
# `sre-agent fixture record` to write them and `sre-agent fixture verify` to check them.
id: vendor-maintenance-future-01
family: vendor-notice
description: 'One maintenance window read on 17 September for 2 October: valid time leads observed time by a fortnight, which is the project''s first announced fact. Exercises the deterministic notice ref, the announced window emitted unchanged, the VENDOR actor kind, the THIRD_PARTY vendor node with its host claims, and the announcement state defaulting to announced and staying there while the window is still ahead. Synthetic structural twin: no identifier is derived from the organisation and no vendor it depends on appears (contracts/sanitisation.md §7). The payloads are already the sanitised form — the six typed fields and a pointer — because that is the shape the source emits, so no body and no sender exists to remove (FR-071, FR-072).'
schema_version: 1.0.0
sdk_version: 0.1.0
hand_authored: false
events: events.jsonl
sources:
    - source_id: vendor-notice:twin
      kind: vendor-notice
      ordering: none
      reordering_window: 6h0m0s
clock:
    start: 2026-09-17T10:00:00Z
    end: 2026-10-02T05:00:00Z

queries:
  # The vendor and its announced change, as known on the day the notice was read. Pinned, so the
  # golden does not encode the day it was recorded (fixture-format.md).
  - name: vendor-2hop-as-read
    kind: subgraph
    focus: vendor=twin-gpu
    valid_at: 2026-10-02T03:00:00Z
    observed_at: 2026-09-17T12:00:00Z
    hops: 2
    direction: both
  # The same graph read during the announced window, a fortnight after the notice. The change is
  # valid here and was observed a fortnight earlier: an ordinary bitemporal read, which is FR-064's
  # whole claim (nothing about an announced fact is a special case).
  - name: vendor-2hop-in-window
    kind: subgraph
    focus: vendor=twin-gpu
    valid_at: 2026-10-02T03:00:00Z
    observed_at: 2026-10-02T03:00:00Z
    hops: 2
    direction: both
  # The extent, which is what says the feeder was watching.
  - name: extent
    kind: extent
