id: gcp-rollback-01
family: gcp-rollout
description: 'Traffic moved to the new revision at 14:20 and back to the old one at 14:41. The split property has three versions in valid time, the rollback is its own third change at its own instant rather than a deletion of the second (FR-017), and a query as of 14:30 reports the new revision serving. Synthetic structural twin: no identifier is derived from the organisation (contracts/sanitisation.md §7), and constitution VIII says synthetic-only data is not enough for a connector to be marked stable — US7''s recording replaces it by swapping payloads/, not by changing code.'
schema_version: 1.0.0
sdk_version: 0.1.0
hand_authored: false
events: events.jsonl
sources:
    - source_id: gcp:twin
      kind: gcp
      ordering: none
      reordering_window: 10m0s
clock:
    start: 2026-09-21T14:00:00Z
    end: 2026-09-21T16:30:00Z

queries:
  # As of 14:30 the new revision is serving. This is the query that fails if the rollback were
  # recorded as a correction of the forward shift rather than as its own change.
  - name: storefront-asof-1430
    kind: subgraph
    focus: gcp.cloudrun.service=twin-production/europe-west1/storefront
    valid_at: 2026-09-21T14:30:00Z
    observed_at: 2026-09-21T20:00:00Z
    hops: 1
    direction: both
  # As of the end of the clock the old revision is serving again.
  - name: storefront-asof-end
    kind: subgraph
    focus: gcp.cloudrun.service=twin-production/europe-west1/storefront
    valid_at: 2026-09-21T20:00:00Z
    observed_at: 2026-09-21T20:00:00Z
    hops: 1
    direction: both
  # Both shifts in one window: two changes, not one.
  - name: storefront-diff-over-both-shifts
    kind: diff
    focus: gcp.cloudrun.service=twin-production/europe-west1/storefront
    t1: 2026-09-21T14:19:00Z
    t2: 2026-09-21T14:42:00Z
    observed_at: 2026-09-21T20:00:00Z
    hops: 2
    direction: both
