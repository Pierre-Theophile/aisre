id: datadog-small-bucket-01
family: datadog-budget
description: 'Discovery against a logs aggregate bucket of 2 calls per 10-second window, the shape the first live run met. The reserve a small bucket is held to is half its limit, so one call per window is the connector''s and the other stays unspent; a measurement the budget stops is suspended until the stated reset and resumes over the same window, its answers cached. The twelve aggregates of `checkout`''s measurement take twelve windows, one each, and the tick is pushed once, complete: the `version` tag is accepted and the pointer carries its join key. The rollout lookup that follows finds the window''s call spent and says so, typed `quota`; it looks again next interval. Synthetic structural twin: no identifier is derived from the organisation.'
