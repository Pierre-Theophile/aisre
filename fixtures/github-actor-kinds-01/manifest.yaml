description: 'Four rollouts whose actor kinds must come from the payload and never from the login (SC-005). A machine user called `deploy-bot` that GitHub types as a USER account is a PERSON; a person whose login reads like one, `marie-curie`, typed as a BOT is AUTOMATION; a scheduled run is a CONTROLLER whatever its actor says, because GitHub attributes a scheduled run to whoever last edited the workflow file and that person did not deploy anything; and a login on the operator''s automation list is AUTOMATION whatever GitHub types it. Each change records which rung decided and on what evidence — and the evidence never carries the login''s value. Synthetic structural twin: no identifier is derived from any organisation (contracts/sanitisation.md §7), and constitution VIII says synthetic-only data is not enough for a connector to be marked stable — a recording campaign replaces it by swapping payloads/, not by changing code.'
