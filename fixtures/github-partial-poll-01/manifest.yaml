id: github-partial-poll-01
family: github
description: 'A poll that failed part-way. Two deployments are announced; the statuses of the first arrive and the statuses of the second do not, and the poll marker says `partial` with its reason. One ROLLOUT is emitted, the unread deployment is DEFERRED rather than retracted — work not done yet is not work decided against (FR-073) — and no retraction appears anywhere, because retracting for an unread tail would assert that something stopped existing when the only fact is that nobody looked. The second cycle completes, and its checkpoint follows a declared gap (FR-056). Synthetic structural twin: no identifier is derived from any organisation (contracts/sanitisation.md §7), and constitution VIII says synthetic-only data is not enough for a connector to be marked stable — a recording campaign replaces it by swapping payloads/, not by changing code. Synthetic structural twin: no identifier is derived from any organisation (contracts/sanitisation.md §7), and constitution VIII says synthetic-only data is not enough for a connector to be marked stable — a recording campaign replaces it by swapping payloads/, not by changing code.'
