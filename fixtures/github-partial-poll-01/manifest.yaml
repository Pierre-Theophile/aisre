    - source_id: github:twin
      kind: github
      ordering: none
      reordering_window: 5m0s
clock:
    start: 2026-03-01T14:00:00Z
    end: 2026-03-01T15:30:00Z
queries:
  # The rollout the poll DID read, at its own instant. A partial poll still
  # delivers what it reached: the tail it did not reach is not a reason to withhold
  # the head.
  - name: the-rollout-that-was-read
    kind: subgraph
    focus: github.change=repositories/555/deployments/4321/targets/k8s.deployment/shop/storefront
    valid_at: 2026-03-01T14:03:12Z
    observed_at: 2026-03-01T15:30:00Z
    hops: 2
    direction: both
  # ONE version. Its valid interval is closed after a microsecond because that is what
  # a change IS (`changeInstant`), not because anything retracted it — a retraction
  # issued because the poll stopped part-way would appear here as a SECOND version
  # whose observed start closes this one's, and that is the row that must not exist.
  # No subgraph at a single instant can show it.
  - name: the-read-rollout-is-not-retracted
    kind: history
    focus: github.change=repositories/555/deployments/4321/targets/k8s.deployment/shop/storefront
  # The extent: `not present` and `not read at that time` are different answers.
  - name: extent
    kind: extent
    valid_at: 2026-03-01T15:30:00Z
    observed_at: 2026-03-01T15:30:00Z
